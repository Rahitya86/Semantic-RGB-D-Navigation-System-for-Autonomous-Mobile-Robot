local_costmap:
  local_costmap:
    ros__parameters:
      observation_sources: semantic_rgbd
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: semantic_rgbd
        semantic_rgbd:
          topic: /semantic/navigation_obstacles
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_max_range: 6.0
          obstacle_min_range: 0.1
          raytrace_max_range: 7.0
          raytrace_min_range: 0.1
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
